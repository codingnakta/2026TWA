<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리의 TWA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<script id="twa-config">
/* ─────────────────────────────────────────────
   설정
   API_URL        : 저장 서버 주소. 비워두면 /api/twa 를 씁니다.
                    서버가 없으면 자동으로 데모 모드(저장 안 됨)로 동작합니다.
   DEMO_PASSWORDS : 데모 모드에서만 쓰는 비밀번호. 실제 서버가 있으면 무시됩니다.
                    teacher = 선생님. 팀 비밀번호는 선생님이 편집 화면에서 정합니다.
   ───────────────────────────────────────────── */
window.TWA_CONFIG = {
  API_URL: '',
  DEMO_PASSWORDS: { teacher: 'teacher' }
};
</script>
<style id="twa-style">
@font-face{font-family:'KERIS KEDU';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/KERISKEDU-B.woff2) format('woff2')}
@font-face{font-family:'EF Diary';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/EF_Diary.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/Pretendard-Medium.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/Pretendard-Bold.woff2) format('woff2')}
:root{
  --mint:#CDEFEB; --mint-2:#8FDCD3; --mint-ink:#3FB3A6;
  --pink:#FFB6D2; --pink-2:#FF8EBB; --pink-ink:#F0609E; --pink-soft:#FFE6F0; --pink-paper:#FFF7FB;
  --yellow:#FFF4B8; --yellow-2:#FFE27A; --lav:#E3D5FA; --lav-ink:#9A7FD6; --sky:#CFE6FF;
  --paper:#FFFFFF; --ink:#5A3A45; --ink-2:#8C6A74; --ink-3:#BFA3AB; --line:#FFC9DE;
  --display:'EF Diary','Hachi Maru Pop','Zen Maru Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --kedu:'KERIS KEDU','EF Diary','Hachi Maru Pop','Zen Maru Gothic',sans-serif;
  --body:'Pretendard','Zen Maru Gothic','Apple SD Gothic Neo','Malgun Gothic','Hiragino Maru Gothic ProN',sans-serif;
  --gingham-pink: linear-gradient(90deg, rgba(255,120,180,.28) 50%, transparent 50%), linear-gradient(rgba(255,120,180,.28) 50%, transparent 50%);
  --gingham-yellow: linear-gradient(90deg, rgba(255,205,60,.28) 50%, transparent 50%), linear-gradient(rgba(255,205,60,.28) 50%, transparent 50%);
  --gingham-mint: linear-gradient(90deg, rgba(60,190,175,.25) 50%, transparent 50%), linear-gradient(rgba(60,190,175,.25) 50%, transparent 50%);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html[lang="ja"]{ --display:'Hachi Maru Pop','Zen Maru Gothic','EF Diary',sans-serif; --body:'Zen Maru Gothic','Pretendard','Hiragino Maru Gothic ProN',sans-serif; }
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--mint);
  background-image:radial-gradient(#fff 2.6px, transparent 3px);
  background-size:16px 16px;
  color:var(--ink); font-family:var(--body); font-size:15px; font-weight:500; line-height:1.7; -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; cursor:pointer}
h1,h2,h3{margin:0; text-wrap:balance; font-family:var(--display); font-weight:400; line-height:1.3}
:focus-visible{outline:2px dashed var(--pink-ink); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

.page{max-width:960px; margin:20px auto 28px; background:var(--paper); border:3px dotted var(--pink); border-radius:20px; box-shadow:0 0 0 7px #fff, 0 12px 30px -10px rgba(240,96,158,.25); overflow:hidden; position:relative}
.wrap{padding-inline:18px}

/* header banner */
.banner{position:relative; padding:26px 22px 18px; background:linear-gradient(100deg,#FFD6E7 0%, #FFF1C9 45%, #D3F3EF 100%); overflow:hidden}
.banner::after{content:""; position:absolute; inset:auto 0 0 0; height:10px; background:radial-gradient(circle at 6px -2px, transparent 6px, #fff 7px) 0 0/14px 10px repeat-x}
.banner .top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap}
.logo{display:block}
.logo .prog{font-size:12px; letter-spacing:.12em; color:var(--pink-ink); font-family:var(--display); margin-bottom:2px}
.logo h1{font-family:var(--kedu); font-weight:700; font-size:clamp(34px,6vw,54px); color:#fff; line-height:1.05;
  text-shadow: 2px 2px 0 var(--pink-2), -2px -2px 0 var(--pink-2), 2px -2px 0 var(--pink-2), -2px 2px 0 var(--pink-2), 0 2px 0 var(--pink-2), 2px 0 0 var(--pink-2), 0 -2px 0 var(--pink-2), -2px 0 0 var(--pink-2), 4px 5px 0 rgba(240,96,158,.25)}
.logo .en{font-family:var(--display); font-size:13px; color:var(--mint-ink); letter-spacing:.08em; margin-top:4px}
.banner .deco{position:absolute; font-size:18px; color:#fff; text-shadow:0 0 0 var(--pink-2); pointer-events:none; user-select:none; opacity:.9}
.spark{position:absolute; color:#fff; font-size:16px; pointer-events:none; animation:tw 1.6s ease-in-out infinite; text-shadow:0 0 4px rgba(255,255,255,.9)}
.spark:nth-child(2n){animation-delay:.5s} .spark:nth-child(3n){animation-delay:1s; font-size:12px}
@keyframes tw{0%,100%{opacity:.25; transform:scale(.8)} 50%{opacity:1; transform:scale(1.15)}}
.flowers{position:absolute; right:18px; bottom:14px; font-size:26px; letter-spacing:4px; pointer-events:none; user-select:none}
.flowers span{display:inline-block; animation:bob 3s ease-in-out infinite}
.flowers span:nth-child(2){animation-delay:.6s} .flowers span:nth-child(3){animation-delay:1.2s} .flowers span:nth-child(4){animation-delay:1.8s}
@keyframes bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)}}
.tools{display:flex; align-items:center; gap:10px; flex-wrap:wrap; position:relative; z-index:1}
.seg{display:inline-flex; gap:4px; background:#fff; border:2px solid var(--pink); border-radius:999px; padding:3px}
.seg button{border:0; background:transparent; padding:2px 12px; border-radius:999px; font-family:var(--display); font-size:14px; color:var(--pink-ink)}
.seg button[aria-pressed="true"]{background:var(--pink-2); color:#fff}
.btn{border:2px solid var(--pink); background:#fff; border-radius:999px; padding:5px 14px; font-family:var(--display); font-size:14px; color:var(--pink-ink); display:inline-flex; align-items:center; gap:6px; transition:transform .1s, background .15s; box-shadow:0 2px 0 var(--pink)}
.btn:hover{background:var(--pink-soft); transform:translateY(-1px)}
.btn:active{transform:translateY(1px); box-shadow:none}
.btn.primary{background:var(--pink-2); color:#fff; border-color:var(--pink-2); box-shadow:0 2px 0 var(--pink-ink)}
.btn.mint{border-color:var(--mint-2); color:var(--mint-ink); box-shadow:0 2px 0 var(--mint-2)}
.btn.danger{border-color:var(--lav-ink); color:var(--lav-ink); box-shadow:0 2px 0 var(--lav)}
.btn:disabled{opacity:.5; cursor:not-allowed}

/* nav ribbon */
.nav{display:flex; align-items:center; flex-wrap:wrap; gap:4px 22px; padding:8px 22px; background:repeating-linear-gradient(135deg, #FFE9F2 0 9px, #fff 9px 18px); border-top:2px dotted var(--pink); border-bottom:2px dotted var(--pink); font-family:var(--display); font-size:16px}
.nav a{color:var(--pink-ink); display:inline-flex; align-items:center; gap:5px; font-family:var(--kedu); font-weight:700}
.nav a::before{content:"✿"; color:var(--pink); font-size:14px}
.nav a:hover{color:var(--mint-ink)}
.nav .spacer{flex:1}
.nav .status{font-size:12.5px; color:var(--ink-2); font-family:var(--body)}

/* frames + tape */
.frame{position:relative; background:var(--yellow); background-image:var(--gingham-yellow); background-size:12px 12px; border-radius:14px; padding:10px}
.frame > .inner{background:#fff; border:2px dotted var(--pink); border-radius:10px; padding:22px 24px}
.tape{position:absolute; width:78px; height:24px; background-color:var(--pink-soft); background-image:var(--gingham-pink); background-size:8px 8px; opacity:.9; box-shadow:0 1px 2px rgba(0,0,0,.08); border-left:1px dashed rgba(255,255,255,.7); border-right:1px dashed rgba(255,255,255,.7)}
.tape.tl{top:-9px; left:22px; transform:rotate(-7deg)}
.tape.br{bottom:-9px; right:22px; transform:rotate(-7deg); background-color:var(--mint); background-image:var(--gingham-mint)}
.tape.tr{top:-9px; right:22px; transform:rotate(6deg); background-color:var(--mint); background-image:var(--gingham-mint)}

/* hero */
.hero{margin:22px 0 0}
.hero h2{font-family:var(--kedu); font-weight:700; font-size:clamp(26px,4.5vw,36px); color:var(--pink-ink); text-shadow:2px 2px 0 var(--pink-soft)}
.hero .en{font-family:var(--display); color:var(--mint-ink); font-size:14px; letter-spacing:.06em}
.hero p{margin:12px 0 0; max-width:62ch; color:var(--ink); font-size:15.5px}
.hero .hearts{color:var(--pink); font-size:14px; letter-spacing:6px; margin-top:12px}

/* ribbons (section titles) */
.ribbon{display:inline-flex; align-items:center; gap:8px; padding:3px 16px 3px 12px; font-family:var(--kedu); font-weight:700; font-size:17px; color:#fff; text-shadow:1px 1px 0 rgba(0,0,0,.12);
  background:repeating-linear-gradient(90deg, var(--pink-2) 0 10px, var(--pink) 10px 20px); border-radius:4px 14px 4px 14px; box-shadow:2px 2px 0 var(--pink-soft)}
.ribbon.mint{background:repeating-linear-gradient(90deg, var(--mint-2) 0 10px, #B7E9E3 10px 20px); box-shadow:2px 2px 0 #E4F7F4}
.ribbon.kedu{font-family:var(--kedu); font-weight:700; font-size:18px; padding-block:2px}
.ribbon.lav{background:repeating-linear-gradient(90deg, var(--lav-ink) 0 10px, #C9B6F0 10px 20px); box-shadow:2px 2px 0 var(--lav)}
.ribbon::before{content:"✿"; font-size:14px}
.sec-head{display:flex; align-items:center; gap:10px; margin:30px 0 14px; padding-bottom:6px; border-bottom:2px dotted var(--line)}
.sec-head .count{font-family:var(--display); color:var(--ink-3); font-size:14px}

/* columns */
.cols{display:grid; grid-template-columns:230px 1fr; gap:22px; margin-top:8px; align-items:start}
.side{display:flex; flex-direction:column; gap:22px}
.side .box{border:2px dotted var(--mint-2); border-radius:12px; padding:12px 14px; background:#F6FDFC; font-size:13px}
.side .box .ribbon{margin:-22px 0 8px; font-size:16px}
.upd{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.upd li{display:flex; flex-direction:column; gap:1px; padding-bottom:6px; border-bottom:1px dashed #CFEDE9}
.upd li:last-child{border:0; padding:0}
.upd .d{font-family:var(--display); color:var(--mint-ink); font-size:12px; letter-spacing:.04em}
.upd .w{color:var(--ink)}
.upd .w b{font-weight:400; color:var(--pink-ink)}
.upd .w small{display:block; color:var(--ink-2); font-size:12px}
.tag-new{display:inline-block; font-family:var(--display); font-size:10px; color:#fff; background:var(--pink-ink); padding:0 6px; border-radius:999px; margin-left:4px; vertical-align:middle; animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.counter{display:flex; flex-direction:column; gap:10px}
.counter .row{display:flex; flex-direction:column; gap:3px}
.counter .k{font-size:12px; color:var(--ink-2)}
.digits{display:inline-flex; gap:3px; align-items:center}
.digits span{width:22px; height:30px; background:#fff; border:2px solid var(--pink); border-radius:5px; font-family:var(--display); font-size:19px; color:var(--pink-ink); display:grid; place-items:center; font-variant-numeric:tabular-nums; box-shadow:inset 0 -3px 0 var(--pink-soft)}
.digits small{font-family:var(--display); color:var(--ink-2); margin-left:4px; font-size:13px}

/* team cards */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px}
.card{position:relative; background:var(--pink-paper); border:2px dashed var(--pink); border-radius:16px; padding:22px 20px 18px; display:flex; flex-direction:column; gap:12px; transition:transform .15s}
a.card:hover{transform:translateY(-3px) rotate(-.4deg); background:#fff}
.card .tape{width:64px; height:20px}
.card .head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.card h3{font-family:var(--kedu); font-weight:700; font-size:24px; color:var(--pink-ink)}
.members{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13.5px; color:var(--ink-2)}
.members b{color:var(--ink); font-weight:400}
.role{display:inline-block; font-family:var(--display); font-size:11px; color:#fff; background:var(--mint-2); padding:0 7px; border-radius:999px; margin-right:5px; vertical-align:middle}
.role.dev{background:var(--lav-ink)}
.promises{list-style:none; margin:0; padding:12px 0 0; border-top:2px dotted var(--line); display:flex; flex-direction:column; gap:6px}
.promises li{display:flex; gap:8px; font-size:14px}
.promises li .n{font-family:var(--display); color:var(--pink-ink); flex:0 0 auto}
.chip{display:inline-block; font-family:var(--display); font-size:11.5px; padding:1px 9px; border-radius:999px; background:var(--sky); color:#5B8FD8; vertical-align:middle}
.chip.sample{background:var(--yellow-2); color:#9A6B00}
.sticker{flex:0 0 auto; width:64px; height:64px; border-radius:50%; background:var(--pink-2); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--display); transform:rotate(-8deg); line-height:1.1; box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--pink), 0 3px 6px rgba(240,96,158,.3); position:relative}
.sticker::before{content:""; position:absolute; inset:4px; border:2px dotted rgba(255,255,255,.8); border-radius:50%}
.sticker span{font-size:15px}
.sticker small{font-size:9px; font-family:var(--body)}
.card.add{border-style:dotted; border-color:var(--mint-2); background:#F6FDFC; align-items:center; justify-content:center; color:var(--mint-ink); min-height:170px; font-family:var(--display); font-size:18px}
.card.add:hover{background:#fff}

/* overview */
.notice{position:relative; background:#FFFDF3; border:2px solid var(--yellow-2); border-radius:14px; padding:18px 22px; font-size:15px; color:var(--ink); line-height:1.7; box-shadow:3px 3px 0 var(--yellow); white-space:pre-wrap; word-break:break-word}
.notice .tape{width:64px; height:20px}
.notice .empty{color:var(--ink-3)}
.grid .none{grid-column:1/-1; text-align:center; color:var(--ink-3); font-size:14px; padding:26px 10px; border:2px dotted var(--line); border-radius:14px; background:var(--pink-paper)}
.wall{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:10px}
.note{background:#fff; border:2px solid var(--yellow-2); border-radius:12px 12px 12px 2px; padding:10px 14px; font-size:14px; position:relative; box-shadow:2px 2px 0 var(--yellow)}
.note::before{content:"♡"; color:var(--pink-2); margin-right:6px}
.note .by{display:block; font-size:12px; color:var(--ink-2); margin-top:4px; text-align:right}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips .chip{font-size:13px; padding:4px 12px; background:var(--mint); color:var(--mint-ink)}
.chips .chip small{opacity:.7; margin-left:4px}

/* team page */
.team-head{margin:22px 0 0}
.crumb{font-family:var(--display); font-size:14px; color:var(--mint-ink); display:inline-flex; align-items:center; gap:6px; margin-bottom:10px}
.team-head h1{font-family:var(--kedu); font-weight:700; font-size:clamp(30px,5vw,44px); color:var(--pink-ink); text-shadow:2px 2px 0 var(--pink-soft)}
.team-head .members{font-size:15px; margin-top:8px}
.timeline{margin-top:18px; padding:14px 16px; background:#F6FDFC; border:2px dotted var(--mint-2); border-radius:12px; display:flex; flex-direction:column; gap:10px}
.timeline .row{display:flex; align-items:center; flex-wrap:wrap; gap:8px}
.timeline .lbl{font-family:var(--display); font-size:13px; color:var(--mint-ink); margin-right:4px}
.vpill{border:2px solid var(--pink); background:#fff; border-radius:999px; padding:2px 12px; font-family:var(--display); font-size:14px; color:var(--pink-ink); display:inline-flex; gap:6px; align-items:center}
.vpill small{font-family:var(--body); color:var(--ink-2); font-size:12px}
.vpill[aria-pressed="true"]{background:var(--pink-2); border-color:var(--pink-2); color:#fff}
.vpill[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.timeline .arrow{color:var(--pink)}
.vnote{font-size:13.5px; color:var(--ink-2)}
.vnote b{color:var(--ink); font-weight:400; font-family:var(--display)}
.toggle{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer; margin-left:auto}
.toggle input{accent-color:var(--pink-ink)}
.diffsum{font-family:var(--display); font-size:13px; color:#9A6B00; background:var(--yellow); padding:2px 10px; border-radius:999px; display:inline-block}

.doc{display:flex; flex-direction:column; gap:22px; margin-top:22px}
.sec{position:relative; background:#fff; border:2px dotted var(--pink); border-radius:14px; padding:26px 22px 20px}
.sec > .ribbon{position:absolute; top:-16px; left:16px}
.sec .num{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:#fff; color:var(--pink-ink); font-size:12px; margin-right:2px}
.rows{display:flex; flex-direction:column}
.row-f{display:grid; grid-template-columns:minmax(150px,220px) 1fr; gap:4px 18px; padding:10px 0; border-top:1px dashed var(--line)}
.row-f:first-child{border-top:0; padding-top:0}
.row-f .k{font-size:13px; color:var(--pink-ink); font-family:var(--display); padding-top:2px}
.row-f .k::before{content:"✿ "; color:var(--pink)}
.row-f .v{font-size:15px; white-space:pre-wrap; color:var(--ink)}
.row-f .v.empty{color:var(--ink-3)}
.row-f.changed{background:#FFFCE8; background-image:linear-gradient(90deg, rgba(255,215,90,.13) 50%, transparent 50%), linear-gradient(rgba(255,215,90,.13) 50%, transparent 50%); background-size:10px 10px; margin-inline:-10px; padding-inline:14px; border-radius:10px; border-top-color:transparent}
.person .row-f.changed{margin-inline:-6px; padding:10px 12px}
.row-f.changed .k::after, li.changed > span:last-child::before{content:"NEW!"; display:inline-block; font-family:var(--display); font-size:10px; color:#fff; background:var(--pink-ink); padding:0 6px; border-radius:999px; margin-left:6px; vertical-align:middle; animation:blink 1.2s steps(2) infinite}
li.changed > span:last-child::before{margin:0 6px 0 0}
.prev{display:block; margin-top:4px; font-size:13px; color:var(--ink-2)}
.prev s{text-decoration-color:var(--pink-ink)}
.check{display:inline-flex; align-items:center; gap:8px}
.check .box{width:20px; height:20px; border:2px solid var(--pink); border-radius:6px; display:grid; place-items:center; font-size:13px; background:#fff}
.check.on .box{background:var(--pink-2); border-color:var(--pink-2); color:#fff}
.persons{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:14px}
.person{background:var(--pink-soft); background-image:var(--gingham-pink); background-size:12px 12px; border-radius:14px; padding:8px}
.person.dev{background-color:var(--lav); background-image:linear-gradient(90deg, rgba(150,120,220,.22) 50%, transparent 50%), linear-gradient(rgba(150,120,220,.22) 50%, transparent 50%)}
.person .in{background:#fff; border-radius:10px; padding:14px 16px}
.person .who{display:flex; align-items:center; gap:10px; margin-bottom:8px; padding-bottom:8px; border-bottom:2px dotted var(--line)}
.person .who b{font-family:var(--display); font-size:20px; font-weight:400; color:var(--ink)}
.person .row-f{grid-template-columns:1fr; gap:1px; padding:8px 0}
.plist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.plist li{display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start; font-size:16px; padding:10px 14px; border-radius:10px; background:var(--pink-paper)}
.plist li.changed{background:#FFFCE8; background-image:linear-gradient(90deg, rgba(255,215,90,.13) 50%, transparent 50%), linear-gradient(rgba(255,215,90,.13) 50%, transparent 50%); background-size:10px 10px}
.plist li .n{font-family:var(--display); color:var(--pink-ink); font-size:22px; line-height:1.2}
.sign{border:2px solid var(--pink); background:var(--pink-paper)}
.sign p{margin:0 0 12px; font-size:13px; color:var(--ink-2); max-width:70ch}
.sign .line{display:flex; flex-wrap:wrap; gap:8px 28px; font-size:14.5px; align-items:center}
.sign .line .k{font-family:var(--display); color:var(--pink-ink); font-size:13px; margin-right:6px}
.seal{display:inline-grid; place-items:center; width:24px; height:24px; border:2px solid var(--pink-ink); border-radius:50%; color:var(--pink-ink); font-size:11px; font-family:var(--display); margin-left:6px; transform:rotate(-10deg); vertical-align:middle; background:#fff}

/* editing */
.fi{width:100%; font:inherit; font-size:14.5px; color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:10px; padding:8px 10px; resize:vertical; min-height:40px; line-height:1.5; field-sizing:content}

/* modal + toast */
.overlay{position:fixed; inset:0; background:rgba(255,182,210,.45); backdrop-filter:blur(2px); z-index:50; display:grid; place-items:center; padding:20px}
.modal{background:#fff; color:var(--ink); border:3px dotted var(--pink); border-radius:18px; padding:22px 24px; width:min(520px,100%); box-shadow:0 0 0 6px #fff, 0 20px 50px -20px rgba(240,96,158,.5); display:flex; flex-direction:column; gap:14px}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#fff; color:var(--pink-ink); border:2px solid var(--pink); padding:8px 16px; border-radius:999px; font-family:var(--display); font-size:14px; z-index:60; box-shadow:0 4px 12px rgba(240,96,158,.25); max-width:calc(100% - 32px)}
